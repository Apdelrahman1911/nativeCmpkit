# Modified for nativeCmpkit migration (2026-10-24); source module paths retained.
name: Bug Report
description: Report a bug in nativeCmpkit
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the issue
      placeholder: 1. Add component X to Android/iOS/Desktop...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which nativeCmpkit source module is affected? Existing calf-* paths are retained.
      options:
        - calf-ui
        - calf-file-picker
        - calf-file-picker-coil
        - calf-io
        - calf-camera-picker
        - calf-share
        - calf-webview
        - calf-permissions
        - calf-cupertino-icons
        - calf-core
        - other
    validations:
      required: true

  - type: input
    id: other_module
    attributes:
      label: Specify Other Module (if you selected "other" above)
      description: Only fill this if you chose "other" in the Module dropdown.
      placeholder: e.g., calf-geo, calf-navigation

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Desktop
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or Library Version
      description: nativeCmpkit is currently unpublished. Provide the checkout SHA; identify the original Calf version if reporting historical behavior.
      placeholder: nativeCmpkit main at <commit SHA>
    validations:
      required: true
