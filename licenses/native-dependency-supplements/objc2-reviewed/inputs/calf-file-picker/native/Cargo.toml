# Modified for nativeCmpkit migration (2026-10-24); crate/JNI names preserve the native ABI.
[package]
name = "calf-filepicker-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Apdelrahman1911/nativeCmpkit"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
rfd = "=0.17.2"
raw-window-handle = "=0.6.2"

[dev-dependencies]
# Real embedded JVM/JNI tests only; production does not enable JVM invocation.
jni = { version = "=0.21.1", features = ["invocation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
