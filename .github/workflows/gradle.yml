# Modified for nativeCmpkit migration (2026-10-24).
# Read-only verification; the original auto-publishing workflow is archived under docs/migration/legacy/.
name: nativeCmpkit verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-and-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-24
        with:
          fetch-depth: 0
      - name: Verify migration and evidence structure (no network mutations)
        run: python3 scripts/migration/verify_migration.py
      - name: Verify audit inventory and finding integrity
        run: python3 scripts/audit/validate_audit.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # reviewed stable ref, pinned
        with:
          toolchain: '1.98.0'
      - name: Linux native dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install configured Android platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          # The official SDK registry uses 37.0; AGP 9.4 normalizes compileSdk 37
          # to this canonical package. Do not downgrade the project's API level.
          "$SDKMANAGER" 'platforms;android-37.0'
      - name: Desktop and Android host tests
        if: runner.os == 'Linux'
        # Override inherited 4GiB Gradle + 4GiB Kotlin daemon settings on CI.
        # In-process Kotlin shares the bounded Gradle heap; native forks are capped too.
        run: >-
          xvfb-run -a ./gradlew --continue --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.native.jvmArgs=-Xmx2048m
          desktopTest testAndroidHostTest :sample:android:assembleDebug --no-configuration-cache
      - name: Browser common tests
        if: always() && runner.os == 'Linux'
        run: >-
          ./gradlew --continue --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.native.jvmArgs=-Xmx2048m
          :calf-ui:jsBrowserTest :calf-ui:wasmJsBrowserTest
          --no-configuration-cache
      - name: Browser sample production builds
        if: always() && runner.os == 'Linux'
        # Wasm production optimization exhausted the first run's 2GiB test heap.
        # Isolate this phase, allow 4GiB, and avoid concurrent compiler work.
        run: >-
          ./gradlew --continue --no-daemon --max-workers=1
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          :sample:web-js:jsBrowserDistribution :sample:web-wasm:wasmJsBrowserDistribution
          --no-configuration-cache
      - name: Apple and desktop tests plus simulator framework
        if: runner.os == 'macOS'
        run: >-
          ./gradlew --continue --max-workers=1
          '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.native.jvmArgs=-Xmx2048m
          desktopTest iosSimulatorArm64Test
          :sample:common:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache
      - name: Summarize actual JUnit reports (zero is not a passing test suite)
        if: always()
        run: python3 scripts/audit/summarize_junit.py --root . --output build/audit-junit-summary.json
      - name: Retain verification reports only (not packages)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ runner.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/audit-junit-summary.json
            **/build/test-results/**/TEST-*.xml
            !docs/**
            !site/**
