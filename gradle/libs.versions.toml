nativecmpkit-permissions = { module = "io.github.apdelrahman1911.nativecmpkit:nativecmpkit-permissions", version.ref = "nativecmpkit" }
nativecmpkit-webview = { module = "io.github.apdelrahman1911.nativecmpkit:nativecmpkit-webview", version.ref = "nativecmpkit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
