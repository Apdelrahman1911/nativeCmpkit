coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }

kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "kyant-backdrop" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyant-shapes" }

# Android
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# Wasm
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

# For sample
android-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "android-navigation-compose" }
