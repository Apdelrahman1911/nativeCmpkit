# Modified for nativeCmpkit migration (2026-10-24).
# Read-only verification; the original auto-publishing workflow is archived under docs/migration/legacy/.
name: nativeCmpkit verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-and-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-24
        with:
          fetch-depth: 0
      - name: Verify migration and evidence structure (no network mutations)
        run: python3 scripts/migration/verify_migration.py
      - name: Verify audit inventory and finding integrity
        run: python3 scripts/audit/validate_audit.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # reviewed stable ref, pinned
        with:
          toolchain: '1.98.0'
      - name: Linux native dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install configured Android platform
        run: sdkmanager 'platforms;android-37'
      - name: Desktop and Android host tests
        if: runner.os == 'Linux'
        run: ./gradlew desktopTest testAndroidHostTest --no-configuration-cache
      - name: Browser tests
        if: runner.os == 'Linux'
        run: ./gradlew :calf-ui:jsBrowserTest :calf-ui:wasmJsBrowserTest --no-configuration-cache
      - name: Apple and multiplatform test suite
        if: runner.os == 'macOS'
        run: ./gradlew allTests --no-configuration-cache
