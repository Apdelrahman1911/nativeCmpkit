# Modified for nativeCmpkit migration (2026-10-24); these coordinates are not yet published.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compose = "1.12.0"
material3 = "1.12.0-alpha03"
material-icons-extended = "1.7.3"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
kotlinx-browser = "0.5.0"
vanniktech-maven-publish = "0.37.0"
documentfile = "1.1.0"
coil = "3.6.2"
kyant-backdrop = "2.0.1"
kyant-shapes = "1.2.1"
javafx = "21.0.13"
robolectric = "4.16.1"
junit = "4.13.2"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-core = "1.19.1"

nativecmpkit = "0.1.0"

android-minSdk = "23"
android-compileSdk = "37"

java = "17"

# For sample
activity-compose = "1.13.0"
# androidx.navigation 2.10+ declares minSdk 24; 2.9.x is the last line that keeps calf-navigation at minSdk 23.
android-navigation-compose = "2.9.7"
# The sample pairs CMP 1.12 with JetBrains navigation 2.10, whose Android artifact requires minSdk 24.
android-sample-minSdk = "24"
kotlinx-coroutines = "1.11.0"
appcompat = "1.8.0"
compose-ui = "1.12.1"
android-lifecycle = "2.2.0"
play-services-location = "21.4.0"
jetbrains-navigation-compose = "2.10.0-alpha02"
# Test-only public back-event input: exact existing Compose UI1.12 runtime dependency.
jetbrains-navigationevent = "1.1.0"
ktor = "3.5.2"

[libraries]
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-jetbrainsCompose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
