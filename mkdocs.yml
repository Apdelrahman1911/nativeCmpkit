# Modified for nativeCmpkit migration (2026-10-24). This config has not been deployed.
# An unintended legacy Pages event is documented in docs/migration/pages-incident.md.
# Project information
site_name: 'nativeCmpkit'
site_description: 'A library that allows you to easily create adaptive UIs and access platform specific APIs from your Compose Multiplatform apps.'
site_author: 'nativeCmpkit contributors; original Calf authors credited in NOTICE'
site_url: 'https://apdelrahman1911.github.io/nativeCmpkit/'
# Reserved for a future owner-authorized deployment; preserved upstream gh-pages is immutable.
remote_branch: nativecmpkit-pages
edit_uri: ""
hooks:
  - scripts/audit/mkdocs_repository_links.py

# Preserve archives in Git, not in generated website output or the search index.
# Raw archived text is untrusted historical evidence, never a macro/template input.
exclude_docs: |
  migration/upstream-metadata/**
  migration/git/**
  migration/legacy/**
  testing/evidence/**
  testing/*-probes/**
  audit/source-inventory.json
  audit/findings/**
  audit/issue-drafts/**

# Repository
repo_name: 'Apdelrahman1911/nativeCmpkit'
repo_url: 'https://github.com/Apdelrahman1911/nativeCmpkit'

# Configuration
theme:
  name: 'material'
  language: 'en'
  favicon: 'images/logo.ico'
  logo: 'images/logo.svg'
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: white
      accent: white
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: red
      accent: lime
  font:
    text: 'Roboto'
    code: 'Roboto Mono'

# Social
extra:
  nativecmpkit_version: '0.1.0-SNAPSHOT'
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/Apdelrahman1911/nativeCmpkit

# Navigation
nav:
  - 'Overview': index.md
  - 'Installation': installation.md
  - 'Adaptive UI':
    - 'Overview': ui.md
    - 'Alert Dialog': ui/adaptive-alert-dialog.md
    - 'Bottom Sheet': ui/adaptive-bottom-sheet.md
    - 'Button': ui/adaptive-button.md
    - 'Circular Progress Indicator': ui/adaptive-circular-progress-indicator.md
    - 'Clickable': ui/adaptive-clickable.md
    - 'Date Picker': ui/adaptive-date-picker.md
    - 'Drop Down': ui/adaptive-drop-down.md
    - 'Icon Button': ui/adaptive-icon-button.md
    - 'Navigation Bar': ui/adaptive-navigation-bar.md
    - 'Slider': ui/adaptive-slider.md
    - 'Switch': ui/adaptive-switch.md
    - 'Time Picker': ui/adaptive-time-picker.md
    - 'Toolbar': ui/adaptive-toolbar.md
    - 'Top Bar': ui/adaptive-top-bar.md
  - 'WebView': webview.md
  - 'File Picker': filepicker.md
  - 'Content Sharing': share.md
  - 'SF Symbols & Cupertino Icons': sf-symbols.md
  - 'Permissions': permissions.md
  #- 'Change Log': changelog.md
  #- 'Contributing': contributing.md
  - 'Maintainer Knowledge Base':
    - 'Architecture': architecture/README.md
    - 'Modules': modules/README.md
    - 'Platforms': platforms/README.md
    - 'Audit': audit/README.md
    - 'Final Report': audit/final-report.md
    - 'Testing': testing/README.md
    - 'Decisions': decisions/README.md
    - 'Roadmap': roadmap/README.md
    - 'Migration': migration/README.md
  - 'Code of Conduct': code_of_conduct.md

# CSS
extra_css:
  - 'css/site.css'

# Extensions
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - search
  - macros:
      # Only four explicitly opted-in usage guides interpolate the version.
      # Audit prose and archived upstream content must never become templates.
      render_by_default: false
  - minify:
      minify_html: true

# Copyright
copyright: |
  &copy; 2025 <a href="https://github.com/MohamedRejeb"  target="_blank" rel="noopener">Mohamed Rejeb</a>
  <br>Migration additions &copy; 2026 nativeCmpkit contributors. Independently maintained; no endorsement implied.
