# Modified for nativeCmpkit (2026-10-26): owner-authorized verification only.
# Manual native verification only. Reports-only recovery uploads; no native payload,
# signing, release or package publication.
name: NativeCmpKit native verification
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Native scope; lock reproducibility and macOS recovery do not replay accepted UI suites
        type: choice
        required: true
        default: all
        options: [all, picker-jni-macos-domain, native-lock-reproducibility, native-lock-windows-source]
permissions:
  contents: read
concurrency:
  group: nativecmpkit-native-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  native-check:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'all'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Linux native dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwayland-dev
      - name: File-picker native checks
        working-directory: calf-file-picker/native
        run: cargo test --locked
      - name: Share native checks
        working-directory: calf-share/native
        run: cargo test --locked

  native-lock-tooling:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch' && (inputs.profile == 'native-lock-reproducibility' || inputs.profile == 'native-lock-windows-source')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Important cache/source/refusal/controller tests only; zero native runtime tests
        if: inputs.profile == 'native-lock-reproducibility'
        run: python3 -B -m unittest discover -s scripts/ci -p test_native_lock_reproducibility.py -v
      - name: Changed checkout and finite Windows-only recovery guards; no accepted host replay
        if: inputs.profile == 'native-lock-windows-source'
        run: python3 -B -m unittest discover -s scripts/ci -p test_native_lock_windows_workflow.py -v

  native-lock-reproducibility:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-reproducibility'
    needs: native-lock-tooling
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: python3
          - platform: macos-arm64
            runner: macos-26
            python: python3
          - platform: macos-x64
            runner: macos-26-intel
            python: python3
          - platform: windows-x64
            runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Before checkout: retain long archives and the exact source bytes on Windows.
    # Repository/job-local Git configuration only; no machine-wide changes.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Linux native Wayland build metadata only
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev pkg-config
      - name: Two empty-cache locked builds of both crates; no accepted UI/native test replay
        run: ${{ matrix.python }} scripts/ci/native_lock_reproducibility.py --platform ${{ matrix.platform }} --output build/ci-verification/native-lock-${{ matrix.platform }}
      - name: Preserve JSON receipts and complete locked graphs only, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-${{ matrix.platform }}/*.json

  native-lock-windows-source:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-windows-source'
    needs: native-lock-tooling
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Recover only the failed actual Windows host; no accepted Linux or macOS replay
        run: python scripts/ci/native_lock_reproducibility.py --platform windows-x64 --output build/ci-verification/native-lock-windows-x64
      - name: Preserve JSON receipts only, including failed stages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-windows-x64/*.json

  picker-jni-macos-domain:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'picker-jni-macos-domain'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Important finite JNI receipt regressions only; not native/library executions
        run: python3 -B -m unittest discover -s scripts/ci -p test_picker_jni_paths.py -v
      - name: Record the actual clean macOS arm64 JDK17 Rust and Xcode runtime
        id: runtime
        run: python3 scripts/ci/runtime_context.py --expected-arch arm64 --require-clean --apple --output build/ci-runtime/picker-jni-macos.json
      - name: Recover only actual filesystem-domain and four controlled negative JNI methods
        run: python3 scripts/ci/picker_jni_paths.py --focus macos-domain --output build/ci-verification/picker-jni-macos-domain
      - name: Preserve JSON receipts only, including failures; never native executables or logs
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: picker-jni-macos-domain-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-runtime/picker-jni-macos.json
            build/ci-verification/picker-jni-macos-domain/*.json
