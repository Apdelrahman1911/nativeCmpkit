name: Android Camera lifecycle host NEW2

# R3's two new Robolectric host regressions only; never device/native C1 acceptance.
on:
  workflow_dispatch:
  # Bootstrap the new workflow without modifying the protected default branch.
  # Further unrelated/documentation pushes do not rerun these two methods.
  push:
    branches: ['development/android-camera-lifecycle-20261106']
    paths:
      - '.github/workflows/android-camera-lifecycle-host.yml'
      - 'calf-camera-picker/src/androidHostTest/kotlin/com/mohamedrejeb/calf/camerapicker/AndroidCameraLifecycleTest.kt'
      - 'calf-camera-picker/src/androidMain/kotlin/com/mohamedrejeb/calf/camerapicker/CameraPickerLauncher.android.kt'
      - 'calf-webview/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: android-camera-lifecycle-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-new2:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/development/android-camera-lifecycle-20261106'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;23.0 platforms;android-37.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Run only the two new AndroidCameraLifecycleTest host methods
        id: regressions
        env:
          HOST_NEW2_ROOT: ${{ runner.temp }}/android-camera-lifecycle-host-new2
          HOST_NEW2_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          python3 -B - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          repository = Path(os.environ['HOST_NEW2_REPOSITORY_ROOT'])
          if not repository.is_absolute() or repository.resolve(strict=True) != Path.cwd().resolve(strict=True):
              raise SystemExit('Host NEW2 not started: invocation must use the exact owning checkout root.')
          disk = shutil.disk_usage(Path.cwd()).free
          memory_fields = next((line.split() for line in Path('/proc/meminfo').read_text(encoding='ascii').splitlines()
                                if line.startswith('MemAvailable:')), None)
          if memory_fields is None or len(memory_fields) != 3 or memory_fields[2] != 'kB':
              raise SystemExit('Host NEW2 not started: actual MemAvailable could not be qualified.')
          memory = int(memory_fields[1]) * 1024
          if disk < 8 * 1024**3 or memory < 6 * 1024**3:
              raise SystemExit(f'Host NEW2 not started: requires 8 GiB disk / 6 GiB MemAvailable; observed bytes {disk} / {memory}.')
          root = Path(os.environ['HOST_NEW2_ROOT'])
          root.mkdir(mode=0o700)
          (root / 'junit').mkdir(mode=0o700)
          print(f'Actual capacity qualified: disk_free_bytes={disk}; MemAvailable_bytes={memory}.')
          PYTHON
          cat > "$HOST_NEW2_ROOT/fresh-test-only.init.gradle" <<'GRADLE'
          import org.gradle.api.tasks.testing.Test

          def owningRootInput = System.getenv('HOST_NEW2_REPOSITORY_ROOT')
          if (owningRootInput == null || owningRootInput.isEmpty() || !new File(owningRootInput).isAbsolute()) {
              throw new GradleException('Host NEW2 requires an explicit absolute owning checkout root')
          }
          def owningRoot = new File(owningRootInput).canonicalFile
          def declaredPluginRoot = new File(owningRoot, 'convention-plugins').canonicalFile

          // Init scripts also apply to the explicitly declared plugin composite.
          // Qualify its exact settings root, never an absent task in an arbitrary graph.
          gradle.settingsEvaluated { settings ->
              def actualRoot = settings.rootDir.canonicalFile
              if (actualRoot == declaredPluginRoot && actualRoot != owningRoot) {
                  println 'NATIVECMPKIT_HOST_NEW2_SCOPE context=declared-plugin'
                  return
              }
              if (actualRoot != owningRoot) {
                  throw new GradleException('Host NEW2 refused a foreign settings root')
              }
              println 'NATIVECMPKIT_HOST_NEW2_SCOPE context=owning'

              // Bind the report after project/plugin configuration and task selection.
              // The exact output is finalized before Test executes; no later convention
              // may silently redirect the evidence away from this owned fresh directory.
              gradle.taskGraph.whenReady { graph ->
                  def task = graph.allTasks.find { it.path == ':calf-camera-picker:testAndroidHostTest' }
                  if (!(task instanceof Test)) {
                      def selectedTaskState = task == null ? 'missing' : 'wrong-type'
                      throw new GradleException('Expected the exact Android host Test task in the selected execution graph; owning_selected_task=' + selectedTaskState)
                  }
                  task.outputs.upToDateWhen { false }
                  task.outputs.doNotCacheIf('Fresh actual AndroidCameraLifecycle NEW2 execution') { true }
                  task.reports.junitXml.required.set(true)
                  task.reports.junitXml.outputLocation.set(new File(System.getenv('HOST_NEW2_ROOT'), 'junit'))
                  task.reports.junitXml.required.finalizeValue()
                  task.reports.junitXml.outputLocation.finalizeValue()
                  task.filter.setFailOnNoMatchingTests(true)
                  task.ignoreFailures = false
                  task.logger.lifecycle('NATIVECMPKIT_HOST_NEW2_JUNIT task=' + task.path +
                      ' directory=' + task.reports.junitXml.outputLocation.get().asFile)
              }
          }
          GRADLE
          ./gradlew --no-daemon --no-configuration-cache --console=plain --max-workers=2 --build-cache \
            --init-script "$HOST_NEW2_ROOT/fresh-test-only.init.gradle" \
            :calf-camera-picker:testAndroidHostTest \
            --tests 'com.mohamedrejeb.calf.camerapicker.AndroidCameraLifecycleTest.nonFinishingRestorationThenCallbackSwapDeliversOneReadableResultToCurrentOwner' \
            --tests 'com.mohamedrejeb.calf.camerapicker.AndroidCameraLifecycleTest.nonFinishingRestorationThenCallbackSwapCancelsOnlyOwnedOutputAndSuppressesOldCallbacks'
      - name: Require exactly the two declared methods in fresh passing JUnit XML
        if: ${{ !cancelled() && steps.regressions.outcome != 'skipped' }}
        env:
          HOST_NEW2_ROOT: ${{ runner.temp }}/android-camera-lifecycle-host-new2
        run: |
          python3 -B - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class NoDtdBuilder(ET.TreeBuilder):
              def doctype(self, name, public_id, system_id):
                  raise ValueError('DTD/entity declarations are not JUnit evidence')

          classname = 'com.mohamedrejeb.calf.camerapicker.AndroidCameraLifecycleTest'
          expected = {(classname, name) for name in (
              'nonFinishingRestorationThenCallbackSwapDeliversOneReadableResultToCurrentOwner',
              'nonFinishingRestorationThenCallbackSwapCancelsOnlyOwnedOutputAndSuppressesOldCallbacks',
          )}
          reports = sorted((Path(os.environ['HOST_NEW2_ROOT']) / 'junit').glob('*.xml'))
          if len(reports) != 1 or reports[0].name != f'TEST-{classname}.xml':
              raise SystemExit('Expected exactly one fresh AndroidCameraLifecycleTest JUnit XML report.')
          suite = ET.fromstring(reports[0].read_bytes(), parser=ET.XMLParser(target=NoDtdBuilder()))
          cases = list(suite.iter('testcase'))
          actual = {(case.get('classname'), case.get('name')) for case in cases}
          if (suite.tag != 'testsuite' or suite.get('tests') != '2'
                  or any(suite.get(key) != '0' for key in ('failures', 'errors', 'skipped'))
                  or len(cases) != 2 or actual != expected
                  or any(suite.find('.//' + tag) is not None for tag in ('failure', 'error', 'skipped'))):
              raise SystemExit('JUnit XML must contain exactly the two declared methods once each, without failures/errors/skips.')
          print('Verified exactly two fresh Robolectric host regressions; device/native C1 remains unverified.')
          PYTHON
      - name: Preserve fresh host JUnit XML only
        if: ${{ !cancelled() && steps.regressions.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-camera-lifecycle-host-new2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/android-camera-lifecycle-host-new2/junit/*.xml
