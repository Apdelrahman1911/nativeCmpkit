# Modified for nativeCmpkit (2026-10-26): owner-authorized, library-only verification.
# No publication/deployment; action SHAs are voluntary, not a required setting.
name: NativeCmpKit verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification scope (targeted profiles preserve explicit incomplete coverage)
        type: choice
        required: true
        default: core
        options: [core, browser, browser-picker, browser-coil-io, browser-coil-io-js, browser-coil-io-wasm, webview-browser, webview-content-transitions, webview-request-state, webview-content-policy-linux, webview-content-policy-android, webview-content-policy-js, webview-content-policy-wasm, ios-webview-content-policy, webview-offline-destination, webview-desktop-request-state, webview-desktop-stop-windows-recovery, webview-desktop-security-regressions, webview-desktop-request-state-linux-pair, webview-desktop-request-state-macos-pair, webview-desktop-request-state-windows-single, webview-desktop-security-linux-arm64-windows-pair, webview-desktop-security-macos-pair, webview-desktop-policy-macos-recovery, webview-desktop-tls-windows-recovery, webview-wasm, share-browser, share-clipboard-native, share-clipboard-native-wasm, ui-dropdown-platforms, ui-dropdown-android-recovery, ui-date-platforms, ui-date-browser, ui-date-js, ui-date-wasm, ui-date-android, navigation-geo, navigation-desktop, webview-desktop, webview-identity, webview-identity-linux, webview-identity-browser, webview-identity-wasm, webview-identity-android, webview-identity-recovery, webview-identity-remount-recovery, webview-identity-ios-remount-recovery, webview-lifetime, webview-lifetime-android, webview-lifetime-android-media, webview-lifetime-linux, webview-lifetime-macos-arm64, webview-lifetime-macos-x64, webview-lifetime-macos-media, webview-lifetime-windows, picker-batch, picker-batch-recovery, picker-batch-linux, picker-batch-macos, picker-batch-windows, picker-saver-state, picker-linux-portal, picker-linux-portal-save, desktop-data-safety, android-resource-safety, android-coil-resource, android-permission-alias, permissions-unsupported, permissions-unsupported-windows, permissions-ios, permissions-ios-safety, permissions-ios-empty-batch, permissions-ios-calendar-configuration, macos-share-lifecycle, macos-share-missing-lifecycle, permissions-completion-android, navigation-geo-matrix, apple, ios, ios-ui, ios-ui-adaptive-pre26, ios-ui-adaptive-drag-shader-ios26plus, ios-secure-alert-input, ios-date-bounds, ios-date-replacement, ios-date-compact, ios-dates-important, ios-alert-date-important, ios-alert-important-recovery, ios-modal-ownership-batch, ios-modal-ownership-ipad, ios-modal-lifecycle-replacement, ios-modal-lifecycle-replacement-ipad, ios-modal-lifecycle-memory-recovery, ios-modal-worker-memory-recovery, ios-sheet-cancellation-repeat, ios-modal-completion-cancellation, ios-xctest-startup, ios-modal-xcui-batch, ios-modal-xcui-batch-ipad, ios-popover-anchor, ios-popover-anchor-ipad, ios-popover-bar-recovery, ios-popover-bar-ipad-recovery, ios-popover-geometry-iphone, ios-popover-geometry-ipad, ios-date-year-predicate-red, ios-io, ios-saver-write-failure, ios-picker-batch, ios-picker-recovery, ios-picker-admission, ios-picker-provider-cancellation, ios-camera-ownership-memory-callback, ios-share-presentation-disposal, ios-share-remembered-failure-observation, ios-switch-cancellation, ios-switch-ownership, ios-slider-numeric, ios-ui-state, ios-time-state-recovery, ios-slider-lifecycle, ios-slider-remaining, ios-slider-structure, ios-slider-tap, ios-slider-pair-structure, ios-vector-theme, ios-vector-theme-recovery, ios-vector-rendering-recovery, ios-vector-rendering-iphone-recovery, ios-vector-native-screen-pair, ios-slider-recovery, ios-image-memory, ios-image-memory-darwin, ios-image-profile-recovery, ios-appinfo-capability, ios-appinfo-shape, ios-webview-lifecycle, ios-webview-recovery, ios-webview-request-state, ios-webview-provisional-dns, ios-webview-request-dns, windows, windows-cache, windows-share-loader, windows-share-boundaries, extended, android-device, android-webview, android-webview-popups, android-webview-request-state, android-webview-stop-redirect-recovery, android-navigation-back, android-geo-ownership, android-geo-provider, android-geo-prerequisites, android-share-grants, android-camera-provider, android-camera-provider-minimum, android-camera-no-handler-minimum, android-camera-restoration, android-camera-restoration-dont-keep, android-camera-callback-substitution, android-io-provider-lifecycle, android-io-provider-unavailable, android-io-named-system-providers, android-io-named-external-storage, android-io-default-decode, android-io-oversize, android-saver-identity, android-saver-identity-missing, android-io-reference-regressions, android-io-controlled-remote, android-io-controlled-remote-positive, android-io-controlled-remote-cancel, android-permission-demo, android-permission-demo-call-denial-recovery, android-permission-demo-denial-recovery, android-io-permission-storage-api35, android-permission-storage-api35-recovery, android-permission-storage-compatibility, android-storage-compatibility, android-media-selection-compatibility, android-media-selection-api33, android-media-selection-api34, android-storage-api28, android-storage-api29-target28, android-storage-api29-legacy, android-storage-api29-scoped, android-storage-api30-normal, android-storage-api30-all-files, android-storage-api35-normal, android-storage-api35-all-files, consumer-core-io, consumer-webview, consumer-webview-remaining, consumer-webview-linux-x64, consumer-webview-linux-arm64, consumer-webview-macos-arm64, consumer-webview-macos-x64, consumer-webview-windows-x64, sample-platforms-linux, sample-platforms-apple, sample-builds-linux, sample-builds-apple, all, ios-ui-related-nine-ios26plus, ios-ui-adaptive-customization-ios26plus, tooling]

      offline_tooling_mode:
        description: Explicit offline scopes mode; reuse never waives platform or security gates
        type: string
        required: false
        default: 'off'
      producer_run_id:
        description: Exact reviewed original producer run ID; reuse only
        type: string
        required: false
        default: ''
      producer_attempt:
        description: Exact reviewed original producer attempt; reuse only
        type: string
        required: false
        default: ''
      producer_job_id:
        description: Exact reviewed sole original successful tooling job ID; reuse only
        type: string
        required: false
        default: ''
      producer_artifact_id:
        description: Exact reviewed original signature receipt artifact ID; reuse only
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nativecmpkit-library-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  tooling:
    if: github.repository == 'Apdelrahman1911/nativeCmpkit' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      libraries: ${{ steps.plan.outputs.libraries }}
      webviews: ${{ steps.plan.outputs.webviews }}
      webview_matrix: ${{ steps.plan.outputs.webview_matrix }}
      samples: ${{ steps.plan.outputs.samples }}
      sample_matrix: ${{ steps.plan.outputs.sample_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete history, audit and current development indexes
        run: |
          python3 scripts/migration/verify_migration.py
          python3 scripts/audit/validate_audit.py
          python3 scripts/audit/source_inventory.py --check
          python3 scripts/development/validate_resolutions.py --check
          python3 scripts/development/generate_icon_catalogues.py --check
      - name: Validate explicit offline tooling mode and exact producer selectors
        env:
          TOOLING_MODE: ${{ inputs.offline_tooling_mode }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          PRODUCER_JOB_ID: ${{ inputs.producer_job_id }}
          PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
        run: |
          python3 -B - <<'PYTHON'
          import os, sys
          sys.path.insert(0, "scripts/ci")
          import offline_tooling_provenance as provenance
          try:
              fields = dict(zip(provenance.SELECTORS, (os.environ["PRODUCER_RUN_ID"], os.environ["PRODUCER_ATTEMPT"],
                            os.environ["PRODUCER_JOB_ID"], os.environ["PRODUCER_ARTIFACT_ID"])))
              provenance.configuration(os.environ["TOOLING_MODE"], "build/ci-tooling-reuse/tooling-execution", fields)
          except BaseException as error:
              print(provenance.reuse.canonical({"schema": provenance.SCHEMA, "outcome": "refused",
                    "boundary": "workflow-configuration", "primary_refusal": provenance.sanitized_error(error)}).decode(), file=sys.stderr)
              code = error.code if type(error) is SystemExit and type(error.code) is int else 130 if type(error) is KeyboardInterrupt else 2
              raise SystemExit(code if code != 0 and -255 <= code <= 255 else 2) from None
          PYTHON
      - name: Install the exact offline tooling Rust runtime before eligibility capture
        if: inputs.offline_tooling_mode == 'produce' || inputs.offline_tooling_mode == 'reuse'
        run: |
          command -v rustup
          rustup toolchain install 1.98.0 --profile minimal --no-self-update --component rustfmt --component clippy
      - name: Record exact offline tooling signature
        if: inputs.offline_tooling_mode == 'produce' || inputs.offline_tooling_mode == 'reuse'
        run: |
          python3 -B scripts/ci/offline_tooling_reuse.py capture \
            --output build/ci-tooling-reuse/tooling-record/signature.json
      - name: Offline verification-tool adversarial fixtures (not library passes)
        id: offline
        env:
          TOOLING_MODE: ${{ inputs.offline_tooling_mode }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          PRODUCER_JOB_ID: ${{ inputs.producer_job_id }}
          PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
          NATIVECMPKIT_ACTIONS_READ_TOKEN: ${{ inputs.offline_tooling_mode == 'reuse' && github.token || '' }}
        run: |
          arguments=(--mode "$TOOLING_MODE" --output-dir build/ci-tooling-reuse/tooling-execution)
          case "$TOOLING_MODE" in
            off) ;;
            produce)
              arguments+=(--recorded-signature build/ci-tooling-reuse/tooling-record/signature.json)
              ;;
            reuse)
              arguments+=(--recorded-signature build/ci-tooling-reuse/tooling-record/signature.json
                          --producer-run-id "$PRODUCER_RUN_ID" --producer-attempt "$PRODUCER_ATTEMPT"
                          --producer-job-id "$PRODUCER_JOB_ID" --producer-artifact-id "$PRODUCER_ARTIFACT_ID")
              ;;
            *) echo 'Unrecognized explicit offline tooling mode' >&2; exit 2 ;;
          esac
          python3 -B scripts/ci/offline_tooling_provenance.py "${arguments[@]}"
          unset NATIVECMPKIT_ACTIONS_READ_TOKEN
          python3 -B - <<'PYTHON'
          import os, sys
          mode = os.environ["TOOLING_MODE"]
          if mode == "off":
              raise SystemExit(0)
          sys.path.insert(0, "scripts/ci")
          import offline_tooling_provenance as provenance
          try:
              reuse = provenance.reuse
              if mode == "produce":
                  result = reuse.parse_json(reuse.read_owned(provenance.ROOT, "build/ci-tooling-reuse/tooling-execution/producer-result.json"))
                  reuse.require(result["mode"] == "produce" and result["outcome"] == "passed"
                                and result["reusable_producer_certificate"] is True
                                and type(result["new_scope_executions"]) is int and result["new_scope_executions"] == len(reuse.SCOPES)
                                and result["authentication_requested"] is False
                                and type(result["signature_sha256"]) is str and reuse.SHA256.fullmatch(result["signature_sha256"]),
                                "Fresh producer output is required")
                  name = reuse.ARTIFACT_PREFIX + result["signature_sha256"]
                  reuse.require(result["artifact_name"] == name, "Producer signature artifact name drift")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("artifact_name=" + name + "\n")
              elif mode == "reuse":
                  leaves = ("signature.json", "signature-after.json", "reuse-decision.json", "acquisition-summary.json")
                  raw = {leaf: reuse.read_owned(provenance.ROOT, "build/ci-tooling-reuse/tooling-execution/" + leaf) for leaf in leaves}
                  before, after, decision, ledger = (reuse.parse_json(raw[leaf]) for leaf in leaves)
                  reuse.validate_signature(before)
                  reuse.validate_signature(after)
                  reuse.require(before == after and type(decision) is dict and set(decision) == {"schema", "mode", "outcome",
                                "fresh_index_and_profile_checks_reused", "library_or_native_results_reused", "consumer_results_reused",
                                "native_failure_waived", "release_readiness_certified", "checker_decision", "new_scope_executions", "signature_sha256",
                                "authenticated_acquisition_completed", "reusable_producer_certificate", "original_zip_sha256", "original_zip_bytes"}
                                and decision["schema"] == provenance.SCHEMA and decision["mode"] == "reuse"
                                and decision["outcome"] == "passed" and decision["authenticated_acquisition_completed"] is True
                                and decision["reusable_producer_certificate"] is False
                                and type(decision["new_scope_executions"]) is int and decision["new_scope_executions"] == 0
                                and decision["signature_sha256"] == before["signature_sha256"], "Original reuse decision and signatures required")
                  checked = decision["checker_decision"]
                  ids = dict(zip(provenance.SELECTORS, (provenance.selector(os.environ[key]) for key in
                             ("PRODUCER_RUN_ID", "PRODUCER_ATTEMPT", "PRODUCER_JOB_ID", "PRODUCER_ARTIFACT_ID"))))
                  reuse.require(type(checked) is dict and set(checked) == {"schema", "eligible", "signature_sha256", *provenance.SELECTORS,
                                "producer_workflow_conclusion", "offline_scopes_reused", "new_scope_executions", "native_failure_waived",
                                "library_or_native_results_reused", "consumer_results_reused", "release_readiness_certified", "authenticated_transport_by_helper"}
                                and checked["schema"] == reuse.SCHEMA and checked["eligible"] is True
                                and checked["producer_workflow_conclusion"] in ("success", "failure")
                                and checked["signature_sha256"] == before["signature_sha256"]
                                and all(type(checked[key]) is int and checked[key] == value for key, value in ids.items())
                                and type(checked["offline_scopes_reused"]) is int and checked["offline_scopes_reused"] == len(reuse.SCOPES)
                                and type(checked["new_scope_executions"]) is int and checked["new_scope_executions"] == 0
                                and checked["authenticated_transport_by_helper"] is False, "Exact original four-ID checker decision required")
                  gates = ("library_or_native_results_reused", "consumer_results_reused", "native_failure_waived", "release_readiness_certified")
                  reuse.require(all(decision[key] is False and checked[key] is False for key in gates)
                                and decision["fresh_index_and_profile_checks_reused"] is False, "Independent gates stay fresh")
                  reuse.require(type(ledger) is dict and set(ledger) == {"schema", "api_requests_started", "storage_hops_started", "requests",
                                "automatic_retries", "automatic_redirects", "raw_headers_or_signed_urls_exported"}
                                and ledger["schema"] == provenance.SCHEMA and ledger["automatic_retries"] is False
                                and ledger["automatic_redirects"] is False and ledger["raw_headers_or_signed_urls_exported"] is False,
                                "Original sanitized once-only ledger required")
                  requests = ledger["requests"]
                  reuse.require(type(requests) is list and 0 < len(requests) <= provenance.MAX_JOB_PAGES + 5
                                and all(type(item) is dict and set(item) == {"number", "operation", "parameters", "channel", "started",
                                "completion_attempted", "response"} for item in requests), "Original finite request inventory required")
                  pages = sum(item["operation"] == "jobs-page" for item in requests)
                  storage = ledger["storage_hops_started"]
                  reuse.require(type(pages) is int and 0 < pages <= provenance.MAX_JOB_PAGES and type(storage) is int and storage in (0, 1)
                                and type(ledger["api_requests_started"]) is int and ledger["api_requests_started"] == pages + 4
                                and len(requests) == pages + 4 + storage
                                and [item["operation"] for item in requests] == ["run-attempt"] + ["jobs-page"] * pages +
                                    ["job", "artifact", "artifact-zip"] + (["storage-zip"] if storage else []), "Once-only request counts and order required")
                  page = 0
                  for number, item in enumerate(requests, 1):
                      page += item["operation"] == "jobs-page"
                      parameters = {**ids, **({"page": page} if item["operation"] == "jobs-page" else {})}
                      reuse.require(type(item["number"]) is int and item["number"] == number and item["parameters"] == parameters
                                    and all(type(value) is int and reuse.positive(value) for value in item["parameters"].values())
                                    and item["channel"] == ("signed-storage" if item["operation"] == "storage-zip" else "authenticated-api")
                                    and item["started"] is True and item["completion_attempted"] is True, "Completed original request identities required")
                      response = item["response"]
                      reuse.require(type(response) is dict and set(response) == {"status", "outcome", "body"}, "Known sanitized response witness required")
                      body = response["body"]
                      redirect = item["operation"] == "artifact-zip" and storage == 1
                      reuse.require(type(response["status"]) is int and response["status"] == (302 if redirect else 200)
                                    and response["outcome"] == ("approved-storage-redirect" if redirect else "complete-original-response")
                                    and type(body) is dict, "Complete original response witness required")
                      reuse.require(body == {"availability": "unread"} if redirect else set(body) == {"complete", "bytes", "sha256"}
                                    and body["complete"] is True and type(body["bytes"]) is int and 0 < body["bytes"] <=
                                        (reuse.MAX_ARCHIVE_BYTES if item["operation"] in ("artifact-zip", "storage-zip") else reuse.MAX_JSON_BYTES)
                                    and type(body["sha256"]) is str and reuse.SHA256.fullmatch(body["sha256"]), "Bounded complete original body witness required")
                  reuse.require(type(decision["original_zip_bytes"]) is int and 0 < decision["original_zip_bytes"] <= reuse.MAX_ARCHIVE_BYTES
                                and type(decision["original_zip_sha256"]) is str and reuse.SHA256.fullmatch(decision["original_zip_sha256"])
                                and requests[-1]["response"]["body"]["bytes"] == decision["original_zip_bytes"]
                                and requests[-1]["response"]["body"]["sha256"] == decision["original_zip_sha256"],
                                "Observed original ZIP byte count required")
                  reuser = reuse.producer_context(before)
                  reuser.update({"revision": before["source"]["revision"], "tree": before["source"]["tree"], "job_id": None})
                  capsule = {"schema": "nativecmpkit-offline-reuse-workflow668-review-v1",
                             "producer": {"repository": reuse.REPOSITORY, "workflow": reuse.WORKFLOW, "branch": reuse.BRANCH,
                                          "revision": before["source"]["revision"], "tree": before["source"]["tree"], **ids},
                             "reuser": reuser,
                             "digests": {"signature_sha256": before["signature_sha256"], **{leaf: reuse.digest(raw[leaf]) for leaf in leaves}},
                             "counts": {"api_requests_started": pages + 4, "storage_hops_started": storage, "job_pages": pages,
                                        "offline_scopes_reused": len(reuse.SCOPES), "new_scope_executions": 0, "original_zip_bytes": decision["original_zip_bytes"]},
                             "reason_codes": ["exact-source-authenticated-reuse-held", "zero-new-offline-scopes",
                                              "native-consumer-fresh-index-profile-gates-independent", "reuser-job-id-unavailable-in-platform-environment"],
                             "limits": {"review_capsule_bytes": 8192, "json_body_bytes": reuse.MAX_JSON_BYTES, "archive_bytes": reuse.MAX_ARCHIVE_BYTES,
                                        "total_acquired_bytes": provenance.MAX_ACQUIRED_BYTES, "job_pages": provenance.MAX_JOB_PAGES,
                                        "acquisition_seconds": provenance.ACQUISITION_SECONDS, "socket_operation_seconds": provenance.IO_SECONDS}}
                  public = reuse.canonical(capsule)
                  reuse.require(len(public) <= 8192, "Bounded sanitized review capsule required")
                  print(public.decode())
              else:
                  reuse.require(False, "Explicit review mode required")
          except BaseException as error:
              print(provenance.reuse.canonical({"schema": provenance.SCHEMA, "outcome": "refused",
                    "boundary": "workflow-producer-artifact-name" if mode == "produce" else "workflow-reuse-review", "primary_refusal": provenance.sanitized_error(error)}).decode(), file=sys.stderr)
              code = error.code if type(error) is SystemExit and type(error.code) is int else 130 if type(error) is KeyboardInterrupt else 2
              raise SystemExit(code if code != 0 and -255 <= code <= 255 else 2) from None
          PYTHON
      - name: Select only the requested verification profile
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p build/ci-plan
          python3 scripts/ci/workflow_matrix.py "$PROFILE" > build/ci-plan/matrix.json
          python3 - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, "scripts/ci")
          import webview_consumer
          import workflow_matrix
          import sample_platform_verification
          webview_matrix = webview_consumer.workflow_matrix(os.environ["PROFILE"])
          matrix = json.load(open("build/ci-plan/matrix.json"))
          sample_matrix = sample_platform_verification.workflow_matrix(os.environ["PROFILE"])
          for row in sample_matrix["include"]:
              sample_plan = sample_platform_verification.plan(sample_platform_verification.ROOT, row["mode"], build_only=row["build_only"])
              with open("build/ci-plan/sample-" + row["mode"] + ".json", "w") as receipt:
                  json.dump(sample_plan, receipt, indent=2, sort_keys=True)
                  receipt.write("\n")
          # Catch CLI/selection drift here, before macOS/Windows/emulator setup.
          # This is read-only source planning, not compilation or executed tests.
          preflight = workflow_matrix.preflight_plans(os.environ["PROFILE"])
          with open("build/ci-plan/source-preflight.json", "w") as receipt:
              json.dump(preflight, receipt, indent=2, sort_keys=True)
              receipt.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write("libraries=" + str(bool(matrix["include"])).lower() + "\n")
              output.write("webview_matrix=" + json.dumps(webview_matrix, separators=(",", ":")) + "\n")
              output.write("webviews=" + str(bool(webview_matrix["include"])).lower() + "\n")
              output.write("sample_matrix=" + json.dumps(sample_matrix, separators=(",", ":")) + "\n")
              output.write("samples=" + str(bool(sample_matrix["include"])).lower() + "\n")
          PYTHON
      - name: Keep successful fixed offline tooling scope receipt
        if: success() && inputs.offline_tooling_mode == 'produce'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.offline.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          path: build/ci-tooling-reuse/tooling-execution/receipt.json

  apple-xctest-startup:
    needs: tooling
    if: inputs.profile == 'ios-xctest-startup' && github.ref == 'refs/heads/development/preview-hardening'
    runs-on: macos-26
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select one actual iPhone without Kotlin, Gradle, Java or Rust setup
        id: runtime
        run: |
          python3 -B scripts/ci/native_ui_input_startup.py --select-simulator
          device="$(python3 -c 'import json; print(json.load(open("build/ci-verification/xctest-startup/selection.json"))["udid"])')"
          state="$(python3 -c 'import json; print(json.load(open("build/ci-verification/xctest-startup/selection.json"))["state"])')"
          if [[ "$state" != Shutdown && "$state" != Booted ]]; then
            echo 'Unknown selected simulator state; never choose another device' >&2
            exit 1
          fi
          printf 'device=%s\ninitial_state=%s\n' "$device" "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == Shutdown ]]; then
            /usr/bin/xcrun simctl boot "$device"
          fi
          /usr/bin/xcrun simctl bootstatus "$device" -b
      - name: Independent Swift XCTest readiness and zero-input completion only
        env:
          SELECTED_SIMULATOR: ${{ steps.runtime.outputs.device }}
        run: python3 -B scripts/ci/native_ui_input_startup.py --simulator "$SELECTED_SIMULATOR"
      - name: Restore only this job's previously shut-down simulator
        if: always() && steps.runtime.outputs.initial_state == 'Shutdown'
        env:
          SELECTED_SIMULATOR: ${{ steps.runtime.outputs.device }}
        run: |
          /usr/bin/xcrun simctl shutdown "$SELECTED_SIMULATOR"
          python3 -B scripts/ci/native_ui_input_startup.py --restore-check "$SELECTED_SIMULATOR"
      - name: Keep bounded source, startup and owning cleanup receipts only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: independent-xctest-startup
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-verification/xctest-startup/receipt.json
            build/ci-verification/xctest-startup/selection.json
            build/ci-verification/xctest-startup/restored.json

  apple-appinfo-shape:
    needs: tooling
    if: inputs.profile == 'ios-appinfo-shape' && github.ref == 'refs/heads/development/preview-hardening'
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          min-wrapper-count: 1
          allow-snapshots: false
      - name: Reuse the pinned compiler and ordinary SDK setup only
        run: |
          command -v rustup
          rustup toolchain install 1.98.0 --profile minimal --no-self-update --component rustfmt --component clippy
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;23.0 platforms;android-37.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Select the existing official SDK23 command-line tools
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          manager = Path(os.environ["ANDROID_HOME"]) / "cmdline-tools/23.0/bin/sdkmanager"
          if not manager.is_file():
              raise SystemExit("SDK23 provisioning did not create the expected manager")
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(manager.parent) + "\n")
          PYTHON
      - name: Record one actual simulator; never switch after selection
        id: runtime
        run: |
          python3 -B scripts/ci/runtime_context.py --expected-arch arm64 --require-clean --apple \
            --select-simulator iphone --output build/ci-runtime/appinfo-selection.json
          device="$(python3 -c 'import json; print(json.load(open("build/ci-runtime/appinfo-selection.json"))["simulator"]["udid"])')"
          state="$(python3 -c 'import json; print(json.load(open("build/ci-runtime/appinfo-selection.json"))["simulator"]["state"])')"
          if [[ "$state" != Shutdown && "$state" != Booted ]]; then
            echo 'Unknown selected simulator state; never choose another device' >&2
            exit 1
          fi
          # Record the exact original row before any boot attempt, including failure.
          printf 'device=%s\ninitial_state=%s\n' "$device" "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == Shutdown ]]; then
            /usr/bin/xcrun simctl boot "$device"
          fi
          /usr/bin/xcrun simctl bootstatus "$device" -b
      - name: Fixed link and current owned install; one appinfo shape only
        env:
          SELECTED_SIMULATOR: ${{ steps.runtime.outputs.device }}
        run: python3 -B scripts/ci/apple_appinfo_shape_route.py run --simulator "$SELECTED_SIMULATOR"
      - name: Restore only this job's previously shut-down simulator boot state
        if: always() && steps.runtime.outputs.initial_state == 'Shutdown'
        env:
          SELECTED_SIMULATOR: ${{ steps.runtime.outputs.device }}
        run: |
          /usr/bin/xcrun simctl shutdown "$SELECTED_SIMULATOR"
          python3 -B scripts/ci/runtime_context.py --expected-arch arm64 --require-clean --apple \
            --simulator "$SELECTED_SIMULATOR" --output build/ci-runtime/appinfo-restored.json
          python3 - <<'PYTHON'
          import json, os
          row = json.load(open("build/ci-runtime/appinfo-restored.json"))["simulator"]
          if row["udid"] != os.environ["SELECTED_SIMULATOR"] or row["state"] != "Shutdown":
              raise SystemExit("Exact original simulator boot-state restoration is unavailable")
          PYTHON
      - name: Keep SDK lexical and source receipts only; no app, logs or native XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apple-appinfo-shape-sdk-prerequisite
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-verification/apple-appinfo-shape/receipt.json
            build/ci-verification/apple-appinfo-shape/library-inputs-before.json
            build/ci-verification/apple-appinfo-shape/library-inputs-after.json

